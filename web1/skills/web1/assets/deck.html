<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deck title</title>
<style>
  html, body { margin: 0; background: #fff; color: #000; }
  body { font-family: "Times New Roman", Times, serif; }
  a { color: #0000ee; }
  a:visited { color: #551a8b; }
  /* Each slide is 16:9 and as large as the window allows; text is sized in cqw, so it scales with the slide. */
  .slide { width: min(100vw, 177.78vh); aspect-ratio: 16 / 9; margin: 0 auto; container-type: inline-size; overflow: hidden; }
  .frame { box-sizing: border-box; height: 100%; position: relative; padding: 4cqw 6cqw; font-size: 2.6cqw; line-height: 1.35; }
  .frame h1 { margin: 0; font-size: 4.2cqw; }
  .frame hr { border: 0; border-top: 0.1cqw solid #000; margin: 1.2cqw 0 2cqw; }
  .frame ul, .frame ol { margin: 0; padding-left: 3cqw; }
  .frame li { margin-bottom: 1cqw; }
  .frame p { margin: 0 0 1.4cqw; }
  .frame img { max-width: 100%; max-height: 30cqw; border: 0.1cqw solid #000; }
  .meta { font-size: 1.8cqw; }
  .quiet { color: #444; font-style: italic; }
  .number { position: absolute; right: 3cqw; bottom: 2cqw; font-size: 1.5cqw; }
  .title .frame { display: flex; flex-direction: column; justify-content: center; }
  .title h1 { font-size: 5.6cqw; }
  table.data { border-collapse: collapse; font-size: 2.2cqw; }
  table.data th, table.data td { border: 0.1cqw solid #808080; padding: 0.3cqw 1cqw; text-align: left; }
  table.data .num { text-align: right; }
  .js .slide:not(.current) { display: none; }
  @page { size: 1280px 720px; margin: 0; }
  @media print {
    .slide { display: block !important; width: 1280px; break-after: page; }
  }
</style>
</head>
<body>

<section class="slide title"><div class="frame">
  <h1>Deck title</h1>
  <hr>
  <div class="meta">Speaker name · 1 November 2026</div>
</div></section>

<section class="slide"><div class="frame">
  <h1>One idea per slide</h1>
  <hr>
  <ul>
    <li>A point, said in one line.</li>
    <li>Another point, with a <a href="https://example.com">link</a>.</li>
    <li>At most five of these.</li>
  </ul>
</div></section>

<section class="slide"><div class="frame">
  <h1>Numbers</h1>
  <hr>
  <table class="data">
    <thead><tr><th>Name</th><th>Count</th><th>Share</th></tr></thead>
    <tbody>
      <tr><td>First</td><td class="num">1,204</td><td class="num">61%</td></tr>
      <tr><td>Second</td><td class="num">512</td><td class="num">26%</td></tr>
    </tbody>
  </table>
  <p class="quiet">Source: where the numbers came from.</p>
</div></section>

<section class="slide title"><div class="frame">
  <h1>Questions</h1>
</div></section>

<script>
  // Arrow keys, space, PageUp/PageDown, Home/End; the URL's #n opens slide n. Printing shows every slide.
  const slides = [...document.querySelectorAll(".slide")];
  slides.forEach((slide, i) => {
    const number = document.createElement("div");
    number.className = "number";
    number.textContent = `${i + 1} / ${slides.length}`;
    slide.querySelector(".frame").append(number);
  });
  document.documentElement.classList.add("js");
  let current = 0;
  const show = i => {
    current = Math.max(0, Math.min(slides.length - 1, i));
    slides.forEach((slide, j) => slide.classList.toggle("current", j === current));
    history.replaceState(null, "", `#${current + 1}`);
  };
  addEventListener("keydown", event => {
    const step = { ArrowRight: 1, ArrowDown: 1, PageDown: 1, " ": 1, ArrowLeft: -1, ArrowUp: -1, PageUp: -1 }[event.key];
    if (step) show(current + step);
    else if (event.key === "Home") show(0);
    else if (event.key === "End") show(slides.length - 1);
    else return;
    event.preventDefault();
  });
  show((parseInt(location.hash.slice(1)) || 1) - 1);
</script>
</body>
</html>
